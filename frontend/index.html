<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS // AI Tactical Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="hud-background">
        <div class="grid-overlay"></div>
        <div class="glow-vignette"></div>
    </div>

    <div class="app-container">
        <!-- Top HUD Header -->
        <header class="hud-header">
            <div class="header-left">
                <div class="system-tag">
                    <span class="pulse-dot"></span>
                    <span class="system-name">JARVIS</span>
                    <span class="system-version">v2.5 ARCH</span>
                </div>
                <div class="status-badge" id="system-status-badge">
                    <span class="status-indicator"></span>
                    <span id="status-text">ONLINE</span>
                </div>
            </div>

            <div class="header-center">
                <div class="hud-ticker">NEURAL LINK: ACTIVE // SECURE CHANNEL</div>
            </div>

            <div class="header-right">
                <div class="time-widget">
                    <div id="live-time" class="live-time">00:00:00</div>
                    <div id="live-date" class="live-date">LOADING DATE</div>
                </div>
                <button id="voice-toggle-btn" class="hud-btn voice-btn" title="Toggle Voice Output">
                    <span class="btn-icon" id="speaker-icon">🔊</span>
                    <span class="btn-text" id="voice-label">VOICE: ON</span>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="hud-main">
            <!-- Left Panel / AI Core Visualizer -->
            <section class="core-section">
                <div class="core-hud-bracket top-left"></div>
                <div class="core-hud-bracket top-right"></div>
                <div class="core-hud-bracket bottom-left"></div>
                <div class="core-hud-bracket bottom-right"></div>

                <div class="core-wrapper">
                    <!-- Outer Rotating Ring 1 -->
                    <div class="orbital-ring ring-outer"></div>
                    <!-- Outer Rotating Ring 2 (Dashed) -->
                    <div class="orbital-ring ring-dashed"></div>
                    <!-- Inner Hex Ring -->
                    <div class="orbital-ring ring-inner"></div>
                    
                    <!-- Pulsing Central Core -->
                    <div class="ai-core-sphere" id="ai-core">
                        <div class="core-energy-layer layer-1"></div>
                        <div class="core-energy-layer layer-2"></div>
                        <div class="core-center-nucleus">
                            <span class="core-icon">⚛</span>
                        </div>
                    </div>

                    <!-- Holographic Audio Waveform Bars (Active when speaking) -->
                    <div class="audio-wave-visualizer" id="wave-visualizer">
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                    </div>
                </div>

                <div class="core-state-display">
                    <div class="state-label">CORE STATE</div>
                    <div class="state-value" id="core-state-text">IDLE</div>
                </div>

                <!-- Telemetry Stats Mini-Widget -->
                <div class="telemetry-bar">
                    <div class="stat-item">
                        <span class="stat-label">AI BRAIN</span>
                        <span class="stat-val" id="model-name-val">GEMINI 2.5</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">LATENCY</span>
                        <span class="stat-val" id="latency-val">~24ms</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">SPEECH I/O</span>
                        <span class="stat-val" id="speech-status-val">READY</span>
                    </div>
                </div>
            </section>

            <!-- Right Panel / Tactical Holographic Chat -->
            <section class="chat-section">
                <div class="chat-header">
                    <span class="chat-title">COMMUNICATION FEED</span>
                    <button id="clear-chat-btn" class="hud-link-btn">CLEAR LOG</button>
                </div>

                <!-- Message Stream -->
                <div class="chat-log" id="chat-log">
                    <!-- Default Initial Welcome Message -->
                    <div class="msg-bubble jarvis-msg">
                        <div class="msg-meta">
                            <span class="sender-tag">JARVIS</span>
                            <span class="timestamp" id="init-time">NOW</span>
                        </div>
                        <div class="msg-content">
                            Good day. I am JARVIS, your personal AI assistant. How may I assist you today, sir?
                        </div>
                    </div>
                </div>

                <!-- Input Controls -->
                <div class="input-container">
                    <button id="mic-btn" class="hud-mic-btn" title="Click to Speak (Web Speech Recognition)">
                        <span class="mic-icon">🎙️</span>
                        <span class="mic-pulse"></span>
                    </button>
                    <form id="chat-form" class="chat-form">
                        <input 
                            type="text" 
                            id="user-input" 
                            placeholder="Type a command or click the microphone..." 
                            autocomplete="off"
                        >
                        <button type="submit" id="send-btn" class="hud-send-btn">
                            <span>TRANSMIT</span>
                            <span class="arrow-icon">▶</span>
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <!-- Bottom Quick Demo Triggers Bar -->
        <footer class="hud-footer">
            <div class="demo-bar-label">DEMO ACTIONS:</div>
            <div class="quick-actions-container">
                <button class="quick-btn" data-prompt="Jarvis, introduce yourself.">
                    <span class="btn-tag">01</span> Introduce Yourself
                </button>
                <button class="quick-btn" data-prompt="Jarvis, what is JavaScript?">
                    <span class="btn-tag">02</span> What is JavaScript?
                </button>
                <button class="quick-btn" data-prompt="Jarvis, search the web for the latest AI news.">
                    <span class="btn-tag">03</span> Search AI News
                </button>
                <button class="quick-btn" data-prompt="Jarvis, what time is it?">
                    <span class="btn-tag">04</span> Current Time
                </button>
                <button class="quick-btn" data-prompt="Jarvis, open YouTube.">
                    <span class="btn-tag">05</span> Open YouTube
                </button>
            </div>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="hud-toast"></div>

    <script src="/static/script.js"></script>
</body>
</html>
